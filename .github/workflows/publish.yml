name: Publish Package

on:
  push:
    branches:
      - main

# Explicitly grant the GitHub Action permission to push the version bump back to the repo
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to push version tags back to the repository

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version Dynamically
        id: version_bump
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const libPath = 'projects/ngx-core-components/package.json';
            const rootPath = 'package.json';
            
            const libPkg = JSON.parse(fs.readFileSync(libPath, 'utf8'));
            const rootPkg = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
            
            let npmVersion = '0.0.0';
            try {
              npmVersion = execSync('npm view ngx-core-components version', { encoding: 'utf8' }).trim();
            } catch (e) {
              console.log('Package not found on npm or error. Using local version.');
            }
            
            const parse = v => v.split('.').map(Number);
            const compare = (v1, v2) => {
              const p1 = parse(v1), p2 = parse(v2);
              for (let i = 0; i < 3; i++) {
                if (p1[i] > p2[i]) return 1;
                if (p1[i] < p2[i]) return -1;
              }
              return 0;
            };
            
            let base = libPkg.version;
            if (compare(npmVersion, base) >= 0) {
              base = npmVersion;
            }
            
            const p = parse(base);
            p[2]++;
            const next = p.join('.');
            console.log('Bumping version to:', next);
            
            libPkg.version = next;
            fs.writeFileSync(libPath, JSON.stringify(libPkg, null, 2) + '\n', 'utf8');
            
            const fsOutput = require('fs');
            fsOutput.appendFileSync(process.env.GITHUB_OUTPUT, 'next_version=' + next + '\n');
          "

      - name: Commit and Tag Version
        run: |
          npm version ${{ steps.version_bump.outputs.next_version }} --no-git-tag-version
          git add package.json package-lock.json projects/ngx-core-components/package.json
          git commit -m "chore: release version ${{ steps.version_bump.outputs.next_version }} [skip ci]"
          git tag v${{ steps.version_bump.outputs.next_version }}

      - name: Build the Angular Library
        run: npx ng build ngx-core-components

      - name: Publish to npm
        # Navigates to the compiled output folder and publishes to npm
        run: |
          cd dist/ngx-core-components
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push Version Update back to GitHub
        # Pushes the newly created version commit and tag back to your main branch
        run: git push origin main --follow-tags